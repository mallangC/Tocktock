services:
  jogak_backend_app:
    image: mallangc/tocktock-backend:1.0.1
    container_name: tocktock-backend
    restart: always
    environment:
      TZ: Asia/Seoul
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JAVA_OPTS: "-Xmx512m"
    ports:
      - "8080:8080"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "1"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 600m
    depends_on:
      - redis
    networks:
      - backend-network

  mysql:
    image: mysql:8.0
    container_name: tocktock-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      TZ: Asia/Seoul
    ports:
     - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend-network

  redis:
    image: redis:latest
    container_name: tocktock-redis
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Seoul
    volumes:
      - redis_data:/data
    networks:
      - backend-network
networks:
  backend-network:
    driver: bridge
volumes:
  redis_data:
    driver: local